<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SR Exam Pro · Live Quiz</title>
<meta name="theme-color" content="#2a2560">
<link rel="icon" href="sr-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1e1a4d; --indigo:#2a2560; --indigo2:#3b347a; --lav:#b4a8f6; --lav2:#d9d2ff; --card:rgba(255,255,255,.10); --line:rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input { -webkit-user-select:text; user-select:text; }
  .warn { background: rgba(250,204,21,.16); border:1px solid rgba(250,204,21,.5); color:#fde68a; border-radius:16px; padding:12px 14px; font-weight:700; font-size:15px; text-align:center; }
  .rules { text-align:left; font-size:15px; line-height:1.5; color:var(--lav2); }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff;
         background: radial-gradient(1200px 600px at 50% -10%, #4b4396 0%, transparent 60%), linear-gradient(180deg, var(--indigo2), var(--ink)); background-attachment: fixed; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 28px; min-height: 100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; }
  header img { width:42px; height:42px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.15); }
  .brand { line-height:1.1; flex:1; }
  .brand b { font-family: Fraunces, Georgia, serif; font-weight:800; font-size:20px; letter-spacing:.01em; }
  .brand small { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--lav2); opacity:.85; }
  header .me { font-size:13px; text-align:right; font-weight:700; }
  .center { flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding-top:10px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight:800; font-size: 32px; margin:0; text-align:center; line-height:1.15; }
  h1 em { font-style: italic; font-weight:600; color: var(--lav); }
  p.sub { margin:0; text-align:center; color:var(--lav2); font-size:16px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 22px; padding: 18px; backdrop-filter: blur(6px); }
  input { width:100%; font: 700 21px Inter, system-ui, sans-serif; padding:16px 18px; border-radius:18px; border:0; outline:none; color:var(--ink); }
  button { font: inherit; cursor:pointer; border:0; }
  .big { width:100%; font-size:21px; font-weight:800; padding:16px; border-radius:18px; background:var(--lav); color:var(--ink); box-shadow:0 5px 0 #7d6fd6; }
  .big:disabled { opacity:.55; }
  .err { background: rgba(225,29,72,.92); padding:10px 14px; border-radius:14px; font-weight:700; text-align:center; }
  .sugg { list-style:none; margin:0; padding:0; background:#fff; border-radius:18px; overflow:hidden; color:var(--ink); }
  .sugg button { width:100%; text-align:left; padding:13px 16px; font-size:17px; font-weight:700; background:#fff; color:var(--ink); border-bottom:1px solid #eee; }
  .sugg li:last-child button { border-bottom:0; }
  .hint { text-align:center; font-size:14px; color:var(--lav2); }
  .logo-big { width:110px; height:110px; margin:0 auto; border-radius:50%; box-shadow:0 0 0 8px rgba(255,255,255,.08), 0 0 0 18px rgba(255,255,255,.04); }
  .qhead { display:flex; justify-content:space-between; align-items:center; font-weight:800; margin:14px 0 8px; }
  .timer { font-variant-numeric: tabular-nums; background: rgba(0,0,0,.25); padding:6px 12px; border-radius:999px; }
  .stem { font-size:21px; font-weight:800; line-height:1.35; }
  .opts { display:grid; gap:12px; margin-top:16px; }
  .opt { display:flex; align-items:center; gap:12px; text-align:left; width:100%; padding:16px; border-radius:18px; font-size:18px; font-weight:700; color:#fff; min-height:64px; }
  .opt .l { flex:none; width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-weight:900; }
  .o0 { background:#e11d48; } .o1 { background:#2563eb; } .o2 { background:#d97706; } .o3 { background:#16a34a; }
  .opt.dim { opacity:.35; } .opt.pick { outline: 4px solid #fff; }
  .opt.right { outline: 4px solid #bbf7d0; } .opt.wrong { opacity:.4; }
  .result { font-size:26px; font-weight:900; text-align:center; }
  .pts { font-family: Fraunces, Georgia, serif; font-size:46px; font-weight:800; text-align:center; }
  .muted { color:var(--lav2); text-align:center; }
  .avatar { font-size:60px; text-align:center; }
  ol { margin:0; padding-left:22px; font-size:18px; font-weight:700; } ol li { margin:6px 0; }
  .cd { font-family: Fraunces, Georgia, serif; font-size: 140px; font-weight:800; text-align:center; line-height:1; animation: zoom .9s ease-out; }
  @keyframes zoom { from { transform: scale(1.8); opacity:0; } 30% { opacity:1; } to { transform: scale(1); } }
  .ini { display:inline-flex; align-items:center; justify-content:center; flex:none; width:1.9em; height:1.9em; border-radius:50%; background: linear-gradient(135deg,#b4a8f6,#7d6fd6); color:#1e1a4d; font-weight:900; font-size:.8em; letter-spacing:.02em; vertical-align:middle; margin-right:.4em; }
  .ini.big { width:96px; height:96px; font-size:36px; margin:0 auto; display:flex; }
  .spin { width:44px; height:44px; border-radius:50%; border:5px solid rgba(255,255,255,.25); border-top-color:var(--lav); animation: s 1s linear infinite; margin: 0 auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  footer { margin-top:22px; text-align:center; font-size:11px; letter-spacing:.08em; color:var(--lav2); opacity:.75; }
  footer b { display:block; letter-spacing:.14em; font-size:11px; }
</style>
</head>
<body>
<main id="app"><div class="center"><div class="spin"></div></div></main>
<script>
const RPC = "https://dewmtikofokfugcidxqa.supabase.co/rest/v1/rpc/";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRld210aWtvZm9rZnVnY2lkeHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MzIyNjUsImV4cCI6MjEwNzEwODI2NX0.VR9M_NO68ES6Aqhutmp7L3HXxcM2_uFIEOMCwimJqe0"; // public (anon) key: these calls only reach the lg_* game functions
function rpc(fn, args) {
  return fetch(RPC + fn, { method: "POST", cache: "no-store", headers: { "content-type": "application/json", apikey: ANON, authorization: "Bearer " + ANON }, body: JSON.stringify(args) })
    .then(function (r) { return r.json(); });
}
const CODE = new URLSearchParams(location.search).get("code") || "";
const KEY = "srq-player" + (CODE ? "-" + CODE : "");
const POLL_MS = 2500;
const app = document.getElementById("app");
let me = null; try { me = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
let st = null, skew = 0, timer = null, poller = null, busy = false, names = [], view = null;

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fold = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const initials = (name) => {
  const w = String(name || "").replace(/^(sr|sister|fr|father|mr|mrs|ms|dr|br)\.?\s+/i, "").split(/[\s.]+/).filter(Boolean);
  return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase();
};
const ini = (name, cls) => `<span class="ini${cls ? " " + cls : ""}">${esc(initials(name))}</span>`;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(me)); } catch (e) {} };
const header = () => `<header><img src="sr-logo.png" alt="SR"><div class="brand"><b>SR Exam Pro</b><small>by SR Edu Technologies</small></div>${me ? `<span class="me">${esc(me.name)}<br>${st && st.phase !== "closed" ? (st.points || 0) + " pts" : ""}</span>` : ""}</header>`;
const footer = `<footer><b>SR EDU TECHNOLOGIES PVT. LTD.</b>INNOVATE · EDUCATE · ELEVATE</footer>`;

async function loadNames() {
  try { const r = await rpc("lg_info", { p_code: CODE || null }); names = (r && r.names) || []; } catch (e) { names = []; }
}

function showJoin(msg) {
  stopPoll(); st = null; app.setAttribute("data-view", "join");
  app.innerHTML = `${header()}<div class="center">
    <img class="logo-big" src="sr-logo.png" alt="">
    <h1>Join the <em>live quiz</em></h1>
    <p class="sub">${names.length ? "Type a few letters and tap your name, or type your own name" : "Type your name and tap Join"}</p>
    <input id="name" maxlength="40" autocomplete="off" placeholder="Your name" aria-label="Your name">
    <ul class="sugg" id="sugg" hidden></ul>
    <button class="big" id="go">Join ▶</button>
    ${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ""}
  </div>${footer}`;
  const input = document.getElementById("name"), go = document.getElementById("go"), sugg = document.getElementById("sugg");
  const update = () => {
    const q = fold(input.value);
    const words = q.split(" ").filter(Boolean);
    const list = q.length >= 2 && !names.includes(input.value)
      ? names.filter((n) => words.every((w) => fold(n).split(" ").some((p) => p.startsWith(w)))).slice(0, 6) : [];
    sugg.hidden = !list.length;
    sugg.innerHTML = list.map((n) => `<li><button type="button" data-n="${esc(n)}">${esc(n)}</button></li>`).join("");
    sugg.querySelectorAll("button").forEach((b) => (b.onclick = () => { input.value = b.dataset.n; sugg.hidden = true; go.focus(); }));
  };
  input.addEventListener("input", update);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  input.focus();
  go.onclick = async () => {
    const name = input.value.trim();
    if (name.length < 2) return showJoin("Type your name (at least 2 letters).");
    go.disabled = true; go.textContent = "Joining…";
    try {
      const r = await rpc("lg_join", { p_name: name, p_code: CODE || null });
      if (!r || r.error || !r.playerId) return showJoin((r && (r.error || r.message)) || "Couldn't join. Try again.");
      me = { p: r.playerId, s: r.seat, name: r.name, avatar: r.avatar }; save(); keepAwake();
      startPoll();
    } catch (e) { showJoin("No internet connection. Try again."); }
  };
}

async function refresh() {
  if (!me || busy) return;
  busy = true;
  try {
    const t0 = Date.now();
    const next = await rpc("lg_state", { p_player: me.p, p_seat: me.s });
    if (next && next.error === "gone") { me = null; try { localStorage.removeItem(KEY); } catch (e) {} await loadNames(); return showJoin("That game has finished. Join the new one."); }
    if (!next || !next.serverNow) return; // server busy or a hiccup: keep the screen, retry on the next poll
    skew = new Date(next.serverNow).getTime() - (t0 + Date.now()) / 2;
    const changed = app.getAttribute("data-view") !== "game" || !st || st.phase !== next.phase || st.index !== next.index || st.answered !== next.answered || st.paused !== next.paused || st.players !== next.players;
    st = next;
    if (changed) render();
  } catch (e) { /* keep the current screen; next poll retries */ }
  finally { busy = false; }
}
function startPoll() { stopPoll(); refresh(); poller = setInterval(refresh, POLL_MS); }
function stopPoll() { if (poller) clearInterval(poller); poller = null; if (timer) clearInterval(timer); timer = null; }

function render() {
  app.setAttribute("data-view", "game");
  if (timer) { clearInterval(timer); timer = null; }
  const s = st;
  if (!s) return;
  if (s.phase === "kicked") { stopPoll(); app.innerHTML = `${header()}<div class="center"><div class="avatar">🚫</div><h1>You are <em>disqualified</em></h1><p class="sub">You left the quiz screen during the game, or the host removed you. Thank you for taking part!</p></div>${footer}`; return; }
  if (s.phase === "lobby") {
    app.innerHTML = `${header()}<div class="center">${ini(me.name, "big")}<h1>You're in, <em>${esc(me.name)}</em>!</h1>
      <p class="sub">Look at the screen. The quiz starts soon…</p><div class="card muted">${s.players} player${s.players === 1 ? "" : "s"} joined</div>
      <div class="card rules">⏱ 20 seconds per question<br>⚡ Correct and faster = more points<br>📵 Keep this screen open</div>
      <div class="warn">⚠️ Once the quiz starts, leaving this screen (switching apps, calls, closing) for more than 5 seconds will disqualify you.</div></div>${footer}`;
    return;
  }
  if (s.phase === "ended") {
    app.innerHTML = `${header()}<div class="center"><div class="avatar">🏆</div><h1>Quiz <em>over!</em></h1>
      <div class="pts">${s.points} pts</div><p class="sub">You came <b>#${s.rank}</b></p>
      ${s.top && s.top.length ? `<div class="card"><b>Top players</b><ol>${s.top.map((t) => `<li>${esc(t.display_name)} · ${t.points}</li>`).join("")}</ol></div>` : ""}
      <p class="muted">Thank you for playing!</p>
      <button class="big" id="again" style="background:#fff;box-shadow:0 5px 0 #c4b5fd">Join a new game</button></div>${footer}`;
    stopPoll();
    document.getElementById("again").onclick = async () => { me = null; st = null; try { localStorage.removeItem(KEY); } catch (e) {} await loadNames(); showJoin(); };
    return;
  }
  if (s.phase === "unsupported" || s.phase === "wait") { app.innerHTML = `${header()}<div class="center"><h1>Get <em>ready…</em></h1><div class="spin"></div></div>${footer}`; return; }
  if (s.phase === "closed") {
    app.innerHTML = `${header()}<div class="center"><div class="avatar">⏰</div><h1>Time's <em>up!</em></h1>
      <p class="sub">${s.answered ? "Your answer is in." : "No answer this time."} Look at the screen for the correct answer…</p><div class="spin"></div></div>${footer}`;
    return;
  }
  const q = s.question;
  if (s.phase === "question" && s.startedAt && Date.now() + skew < new Date(s.startedAt).getTime()) {
    view = "countdown";
    app.innerHTML = `${header()}<div class="center"><p class="sub">Question ${s.index + 1} of ${s.total}</p><div class="cd" id="cd">3</div><h1>Get <em>ready…</em></h1></div>${footer}`;
    tick(); timer = setInterval(tick, 150);
    return;
  }
  view = s.phase;
  const head = `<div class="qhead"><span>Question ${s.index + 1} of ${s.total}</span>${s.phase === "question" ? `<span class="timer" id="t">--</span>` : ""}</div>`;
  if (s.phase === "question") {
    const answered = s.answered;
    app.innerHTML = `${header()}${head}<div class="card stem">${esc(q.stem)}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt o${i % 4} ${answered ? (o.id === s.myChoice ? "pick" : "dim") : ""}" data-id="${esc(o.id)}" ${answered ? "disabled" : ""}><span class="l">${"ABCD"[i] || ""}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
      <p class="muted" id="msg" style="margin-top:14px">${answered ? "✅ Answer locked. Wait for the result…" : s.paused ? "⏸ Paused" : "Tap your answer"}</p>${footer}`;
    if (!answered) app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => send(q.itemId, b.dataset.id)));
    tick(); timer = setInterval(tick, 250);
    return;
  }
  const verdict = !s.answered ? "⏰ No answer" : s.gotIt ? "🎉 Correct!" : "❌ Not this time";
  app.innerHTML = `${header()}${head}<div class="card stem">${esc(q.stem)}</div>
    <div class="opts">${q.options.map((o, i) => {
      const right = s.correct && s.correct.includes(o.id);
      return `<div class="opt o${i % 4} ${right ? "right" : "wrong"} ${o.id === s.myChoice ? "pick" : ""}"><span class="l">${right ? "✓" : "ABCD"[i] || ""}</span><span>${esc(o.text)}</span></div>`;
    }).join("")}</div>
    <div class="card" style="margin-top:16px"><div class="result">${verdict}</div>
      <div class="pts">+${s.lastPoints || 0}</div>
      ${s.answered && s.timeMs != null ? `<p class="muted" style="font-weight:700">⏱ You answered in ${(s.timeMs / 1000).toFixed(1)} seconds${s.gotIt ? " · faster = more points" : ""}</p>` : ""}
      <p class="muted">Total ${s.points} pts · You are #${s.rank}</p>
      ${s.explanation ? `<p class="muted" style="margin-top:8px">${esc(s.explanation)}</p>` : ""}</div>${footer}`;
}

function tick() {
  if (view === "countdown") {
    const left = Math.ceil((new Date(st.startedAt).getTime() - (Date.now() + skew)) / 1000);
    if (left <= 0) return render();
    const c = document.getElementById("cd");
    if (c && c.textContent !== String(left)) { c.textContent = left; c.style.animation = "none"; void c.offsetWidth; c.style.animation = ""; }
    return;
  }
  const el = document.getElementById("t");
  if (!el || !st || st.phase !== "question" || !st.startedAt) return;
  const left = Math.max(0, Math.ceil((new Date(st.startedAt).getTime() + st.limitMs - (Date.now() + skew)) / 1000));
  el.textContent = st.paused ? "⏸" : left + "s";
}

async function send(itemId, choice) {
  app.querySelectorAll(".opt").forEach((b) => { b.disabled = true; b.classList.add(b.dataset.id === choice ? "pick" : "dim"); });
  const msg = document.getElementById("msg"); if (msg) msg.textContent = "Sending…";
  try {
    const r = await rpc("lg_answer", { p_player: me.p, p_seat: me.s, p_item: itemId, p_choice: choice });
    if (r.error && msg) msg.textContent = r.error;
    else if (msg) msg.textContent = "✅ Answer locked. Wait for the result…";
  } catch (e) { if (msg) msg.textContent = "No connection. Tap again."; app.querySelectorAll(".opt").forEach((b) => { b.disabled = false; b.classList.remove("dim", "pick"); }); return; }
  st.answered = true; st.myChoice = choice;
  refresh();
}

(async () => { if (me && me.p) { await checkAway(); keepAwake(); startPoll(); } else { await loadNames(); showJoin(); } })();
// Leaving the quiz screen during the game (more than 5 seconds) disqualifies the player.
const HID = KEY + "-hidden";
const inGame = () => st && (st.phase === "question" || st.phase === "closed" || st.phase === "review");
async function checkAway() {
  let at = 0; try { at = Number(localStorage.getItem(HID) || 0); localStorage.removeItem(HID); } catch (e) {}
  if (me && at && Date.now() - at > 5000) {
    try { await rpc("lg_leave", { p_player: me.p, p_seat: me.s }); } catch (e) {}
  }
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden") {
    if (me && inGame()) { try { localStorage.setItem(HID, String(Date.now())); } catch (e) {} }
    return;
  }
  await checkAway();
  keepAwake();
  if (me) refresh();
});
// Keep the phone screen on during the quiz (so it doesn't sleep and count as leaving).
let wake = null;
async function keepAwake() {
  try { if (me && "wakeLock" in navigator && (!wake || wake.released)) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("click", keepAwake);
</script>
</body>
</html>
