<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Exam Pro · Join the Quiz</title>
<link rel="icon" href="sr-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1e1a4d; --indigo2:#3b347a; --lav:#b4a8f6; --lav2:#d9d2ff; --line:rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family: Inter, system-ui, sans-serif; color:#fff; overflow:hidden;
         background: radial-gradient(1400px 700px at 30% -10%, #4b4396 0%, transparent 60%), linear-gradient(180deg, var(--indigo2), var(--ink)); }
  .wrap { height:100vh; display:grid; grid-template-columns: minmax(380px, 42%) 1fr; gap: 4vw; padding: 3.5vh 4vw; }
  .left { display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 2.2vh; text-align:center; }
  .brandrow { display:flex; align-items:center; gap:14px; }
  .brandrow img { width: 7vh; height:7vh; border-radius:50%; box-shadow:0 0 0 4px rgba(255,255,255,.15); }
  .brandrow .t { text-align:left; line-height:1.05; }
  .brandrow b { font-family: Fraunces, Georgia, serif; font-weight:800; font-size: 4.4vh; }
  .brandrow small { display:block; font-size:1.5vh; letter-spacing:.16em; text-transform:uppercase; color:var(--lav2); }
  h1 { font-family: Fraunces, Georgia, serif; font-weight:800; font-size: 6vh; margin:0; line-height:1.05; }
  h1 em { font-style: italic; font-weight:600; color: var(--lav); }
  .qr { background:#fff; padding: 2vh; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .qr img { display:block; width: min(44vh, 32vw); height:auto; }
  .url { font-size: 2.2vh; color: var(--lav2); }
  .url b { color:#fff; }
  .steps { display:flex; gap: 1.6vw; font-size: 2vh; font-weight:700; color:var(--lav2); }
  .steps span { background: rgba(255,255,255,.08); border:1px solid var(--line); padding: 8px 14px; border-radius: 999px; }
  .right { display:flex; flex-direction:column; min-height:0; }
  .count { display:flex; align-items:baseline; gap: 14px; margin-top: 1vh; }
  .count .n { font-family: Fraunces, Georgia, serif; font-size: 14vh; font-weight:800; line-height:1; }
  .count .l { font-size: 3vh; font-weight:700; color: var(--lav2); }
  .status { font-size: 2.4vh; font-weight:700; margin: .5vh 0 2vh; color: var(--lav); }
  .names { flex:1; min-height:0; overflow:hidden; display:flex; flex-wrap:wrap; align-content:flex-start; gap: 10px; }
  .chip { background: rgba(255,255,255,.12); border:1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 2.2vh; font-weight:700; animation: pop .35s ease-out; }
  .chip.new { background: var(--lav); color: var(--ink); }
  @keyframes pop { from { transform: scale(.6); opacity:0; } to { transform: scale(1); opacity:1; } }
  .foot { margin-top: 2vh; font-size: 1.5vh; letter-spacing:.14em; color: var(--lav2); opacity:.8; }
  .wait { font-size: 2.6vh; color: var(--lav2); }
  @media (max-width: 800px) { body { overflow:auto; } .wrap { grid-template-columns: 1fr; height:auto; } .qr img { width: 70vw; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div class="brandrow"><img src="sr-logo.png" alt="SR"><div class="t"><b>SR Exam Pro</b><small>by SR Edu Technologies</small></div></div>
    <h1 id="title">SR Exam Pro <em>Live Quiz</em></h1>
    <div class="qr"><img src="qr.png" alt="QR code to join"></div>
    <div class="steps"><span>① Scan</span><span>② Find or type your name</span><span>③ Play!</span></div>
    <div class="url">or open <b>likhithareddy3399.github.io/sr-quiz</b></div>
  </section>
  <section class="right">
    <div class="count"><span class="n" id="n">0</span><span class="l">players joined</span></div>
    <div class="status" id="status">Connecting…</div>
    <div class="names" id="names"></div>
    <div class="foot">SR EDU TECHNOLOGIES PVT. LTD. · INNOVATE · EDUCATE · ELEVATE</div>
  </section>
</div>
<script>
const API = "https://dewmtikofokfugcidxqa.supabase.co/functions/v1/sr-quiz";
const CODE = new URLSearchParams(location.search).get("code") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const seen = new Set();
let first = true;
async function poll() {
  try {
    const r = await fetch(`${API}/lobby${CODE ? "?code=" + CODE : ""}`, { cache: "no-store" }).then((r) => r.json());
    const status = document.getElementById("status");
    if (!r.open) {
      status.textContent = "Open the quiz in SR Exam Pro (Live quizzes → Host) to let people join.";
      document.getElementById("n").textContent = "0";
      document.getElementById("names").innerHTML = "";
      seen.clear();
      return;
    }
    document.getElementById("title").innerHTML = esc(r.title).replace(/Quiz$/, "<em>Quiz</em>");
    document.getElementById("n").textContent = r.count;
    status.textContent = r.status === "lobby" ? "Waiting for everyone… the quiz will start soon"
      : r.status === "ended" ? "Quiz finished. Thank you for playing!"
      : `Quiz in progress · Question ${r.index + 1} of ${r.total} · late joiners welcome`;
    const box = document.getElementById("names");
    const html = r.players.map((p) => {
      const isNew = !first && !seen.has(p.display_name);
      seen.add(p.display_name);
      return `<span class="chip${isNew ? " new" : ""}">${esc(p.avatar)} ${esc(p.display_name)}</span>`;
    }).join("");
    box.innerHTML = html;
    first = false;
  } catch { document.getElementById("status").textContent = "Reconnecting…"; }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
